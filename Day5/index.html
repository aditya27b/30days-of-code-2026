<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Let's Play!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">Tic Tac Toe</h1>
            <p class="subtitle">X always goes first!</p>
        </header>

        <div class="game-info">
            <div class="player-turn">
                <span id="turn-text">Player X's Turn</span>
            </div>
            <div class="score-board">
                <div class="score">
                    <span class="player-label">Player X</span>
                    <span class="player-score" id="score-x">0</span>
                </div>
                <div class="score">
                    <span class="player-label">Draws</span>
                    <span class="player-score" id="score-draw">0</span>
                </div>
                <div class="score">
                    <span class="player-label">Player O</span>
                    <span class="player-score" id="score-o">0</span>
                </div>
            </div>
        </div>

        <div class="game-board" id="board">
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
        </div>

        <button class="reset-btn" id="reset">Play Again</button>

        <div class="confetti-container" id="confetti"></div>
    </div>

    <div class="result-modal" id="modal">
        <div class="modal-content">
            <div class="result-icon" id="result-icon"></div>
            <h2 class="result-text" id="result-text"></h2>
            <button class="modal-btn" id="modal-close">Continue</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
